services:
  db:
    image: postgres:16-alpine
    container_name: tastemap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tastemap
    ports:
      - "5433:5432"
    volumes:
      - tastemap-pgdata:/var/lib/postgresql/data

volumes:
  tastemap-pgdata:
