services:
  db:
    image: postgres:16-alpine
    container_name: addis-taste-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: addistaste
    ports:
      - "5433:5432"
    volumes:
      - addistaste-pgdata:/var/lib/postgresql/data

volumes:
  addistaste-pgdata:
